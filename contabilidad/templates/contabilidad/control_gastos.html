{% extends 'base_admin.html' %}
{% load static %}

{% block title %}Registrar Gasto - ReserVa{% endblock %}

{% block content %}
<div class="container-fluid py-4 text-white">

    <!-- Encabezado con botón para volver -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="fw-bold mb-0">Registrar Gasto</h2>
            <span class="text-secondary small">Añade un nuevo egreso al sistema de contabilidad</span>
        </div>
        <a href="{% url 'inicio_contabilidad' %}" class="btn btn-outline-secondary btn-sm text-light">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
    </div>

    <!-- Formulario en Tarjeta Centrada -->
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card card-form-reserva p-4">

                <form method="POST" action="{% url 'guardar_gasto' %}">
                    {% csrf_token %}

                    <!-- Concepto -->
                    <div class="mb-3">
                        <label for="concepto" class="form-label fw-semibold text-secondary small text-uppercase">Concepto</label>
                        <input type="text" id="concepto" name="concepto" class="form-control form-control-dark" placeholder="Ej: Compra de carne premium / Insumos" required value="{{ datos_contabilidad.concepto }}">
                    </div>

                    <div class="row">
                        <!-- Categoría -->
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label fw-semibold text-secondary small text-uppercase">Categoría</label>
                            <select id="categoria" name="categoria" class="form-select form-control-dark" required>
                                <option value="" disabled selected>Seleccionar...</option>
                                <option value="Insumos">INSUMOS</option>
                                <option value="Nomina">NÓMINA</option>
                                <option value="Servicios">SERVICIOS</option>
                                <option value="Mantenimiento">MANTENIMIENTO</option>
                                <option value="Otros">OTROS</option>
                            </select>
                        </div>

                        <!-- Valor -->
                        <div class="col-md-6 mb-3">
                            <label for="valor" class="form-label fw-semibold text-secondary small text-uppercase">Valor ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-warning fw-bold">$</span>
                                <input type="number" step="0.01" id="valor" name="valor" class="form-control form-control-dark" placeholder="0.00" required value="{{ datos_contabilidad.valor }}">
                            </div>
                        </div>
                    </div>

                    <!-- Método de Pago -->
                    <div class="mb-4">
                        <label for="metodo_pago" class="form-label fw-semibold text-secondary small text-uppercase">Método de Pago</label>
                        <select id="metodo_pago" name="metodo_pago" class="form-select form-control-dark" required>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta">Tarjeta / Datáfono</option>
                            <option value="Transferencia">Transferencia</option>
                        </select>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                        <a href="{% url 'inicio_contabilidad' %}" class="btn btn-wine px-4">Cancelar</a>
                        <button type="submit" class="btn btn-gold px-4">Guardar Gasto</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>
{% endblock %}
