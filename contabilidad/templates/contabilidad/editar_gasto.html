{% extends 'base_admin.html' %}
{% load static %}

{% block title %}Editar Gasto - ReserVa{% endblock %}

{% block content %}
<div class="container-fluid py-4">

    <!-- Encabezado -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h2 class="text-white fw-bold mb-0">Editar Gasto</h2>
            <span class="text-secondary small">ID del Registro: #{{ gasto.id }}</span>
        </div>
        <a href="{% url 'inicio_contabilidad' %}" class="btn btn-outline-secondary btn-sm text-light">
            <i class="bi bi-arrow-left me-1"></i> Volver a Contabilidad
        </a>
    </div>

    <!-- Formulario dentro de Tarjeta Oscura -->
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card card-reserva p-4">

                <form action="{% url 'editar_gasto' gasto.id %}" method="POST">
                    {% csrf_token %}

                    <!-- Concepto -->
                    <div class="mb-3">
                        <label for="concepto" class="form-label text-light fw-semibold">Concepto</label>
                        <input type="text" id="concepto" name="concepto" class="form-control form-control-dark" value="{{ gasto.concepto }}" required>
                    </div>

                    <div class="row">
                        <!-- Categoría -->
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label fw-semibold text-secondary small text-uppercase">Categoría</label>
                            <select id="categoria" name="categoria" class="form-select form-control-dark" required>
                                <option value="" disabled selected>Seleccionar...</option>
                                <option value="Insumos">INSUMOS</option>
                                <option value="Nomina">NÓMINA</option>
                                <option value="Servicios">SERVICIOS</option>
                                <option value="Mantenimiento">MANTENIMIENTO</option>
                                <option value="Otros">OTROS</option>
                            </select>
                        </div>

                        <!-- Valor -->
                        <div class="col-md-6 mb-3">
                            <label for="valor" class="form-label text-light fw-semibold">Valor ($)</label>
                            <input type="number" step="0.01" id="valor" name="valor" class="form-control form-control-dark" value="{{ gasto.valor }}" required>
                        </div>
                    </div>

                    <div class="row">


                        <!-- Método de Pago -->
                        <div class="col-md-6 mb-3">
                            <label for="metodo_pago" class="form-label text-light fw-semibold">Método de Pago</label>
                            <select id="metodo_pago" name="metodo_pago" class="form-select form-control-dark" required>
                                <option value="Efectivo" {% if gasto.metodo_pago == "Efectivo" %}selected{% endif %}>Efectivo</option>
                                <option value="Transferencia" {% if gasto.metodo_pago == "Transferencia" %}selected{% endif %}>Transferencia</option>
                                <option value="Tarjeta" {% if gasto.metodo_pago == "Tarjeta" %}selected{% endif %}>Tarjeta</option>
                            </select>
                        </div>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top border-secondary border-opacity-25">
                        <a href="{% url 'inicio_contabilidad' %}" class="btn btn-wine px-4">Cancelar</a>
                        <button type="submit" class="btn btn-gold px-4">Guardar Cambios</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>
{% endblock %}
