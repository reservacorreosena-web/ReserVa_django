{% extends 'base_admin.html' %}
{% load static %}

{% block title %}Editar Plato - ReserVa{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-3">

    <!-- ENCABEZADO SUPERIOR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-white mb-0">Editar Plato</h2>
            <small class="text-white-50">Modifica los detalles del producto en la carta</small>
        </div>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">← Volver</a>
    </div>

    {% if error %}
        <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger text-center fw-bold mb-4" style="max-width: 600px; margin: 0 auto;">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <!-- TARJETA CONTENEDORA -->
    <div class="card bg-dark text-light border-secondary shadow-lg mx-auto" style="max-width: 600px; background-color: #181818 !important; border-color: rgba(255, 255, 255, 0.08) !important; border-radius: 12px;">
        <div class="card-body p-4 p-md-5">

            <form action="" method="POST">
                {% csrf_token %}

                <!-- NOMBRE DEL PLATO -->
                <div class="mb-4 text-center">
                    <label for="nombre" class="form-label text-light opacity-75 fw-bold text-uppercase small tracking-wide">Nombre del Plato</label>
                    <input type="text" id="nombre" name="nombre" class="form-control bg-dark text-white border-secondary text-center py-2" style="background-color: #121212 !important; border-color: rgba(255, 255, 255, 0.15) !important;" required value="{{platos.nombre}}">
                </div>

                <!-- DESCRIPCIÓN -->
                <div class="mb-4 text-center">
                    <label for="descripcion" class="form-label text-light opacity-75 fw-bold text-uppercase small tracking-wide">Descripción</label>
                    <textarea id="descripcion" name="descripcion" class="form-control bg-dark text-white border-secondary text-center py-2" style="background-color: #121212 !important; border-color: rgba(255, 255, 255, 0.15) !important;" rows="3" cols="30">{{platos.descripcion}}</textarea>
                </div>

                <!-- FILA DOBLE: CATEGORÍA Y PRECIO -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6 text-center">
                        <label for="categoria" class="form-label text-light opacity-75 fw-bold text-uppercase small tracking-wide">Categoría</label>
                        <select id="categoria" name="categoria" class="form-select bg-dark text-white border-secondary text-center py-2" style="background-color: #121212 !important; border-color: rgba(255, 255, 255, 0.15) !important;">
                            <option value="entrada">Entrada</option>
                            <option value="fuerte" selected>Plato Fuerte</option>
                            <option value="bebida">Bebida</option>
                            <option value="postre">Postre</option>
                        </select>
                    </div>

                    <div class="col-md-6 text-center">
                        <label for="precio" class="form-label text-light opacity-75 fw-bold text-uppercase small tracking-wide">Precio ($)</label>
                        <input type="number" id="precio" name="precio" class="form-control bg-dark text-white border-secondary text-center py-2" style="background-color: #121212 !important; border-color: rgba(255, 255, 255, 0.15) !important;" required value="{{platos.precio}}">
                    </div>
                </div>

                <!-- CHECKBOXES CENTRADOS -->
                <div class="d-flex flex-column align-items-center gap-2 mb-4">
                    <div class="form-check">
                        <input type="checkbox" id="destacado" name="destacado" value="true" class="form-check-input bg-dark border-secondary">
                        <label for="destacado" class="form-check-label text-light small">
                            ¿Destacar este producto?
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="disponible" name="disponible" value="on" class="form-check-input bg-dark border-secondary" checked>
                        <label for="disponible" class="form-check-label text-light small">
                            Actualmente está disponible?
                        </label>
                    </div>
                </div>

                <!-- BOTÓN PRINCIPAL CENTRADO -->
                <div class="text-center pt-2">
                    <button type="submit" class="btn btn-warning fw-bold px-5 py-2" style="border-radius: 8px;">
                        ACTUALIZAR Plato
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
