{% extends 'base.html' %}
{% load static %}

{% block title %}Reservar Mesa | ReserVa{% endblock %}

{% block content %}
<style>
    .rv-page {
        min-height: 100vh;
        background: #0a0a0a;
        padding: 0px 40px 80px;
    }

    .rv-back-wrapper {
        max-width: 1200px;
        margin: 0 auto 60px;
    }

    .rv-form-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 0px 40px;
    }

    .rv-header {
        text-align: center;
        margin-bottom: 50px;
    }

    .rv-eyebrow {
        display: block;
        color: #c9a961;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 16px;
    }

    .rv-title {
        font-family: 'Playfair Display', serif;
        font-size: 48px;
        color: #fff;
        margin: 0 0 16px;
        font-weight: 400;
        line-height: 1.2;
    }

    .rv-subtitle {
        color: #888;
        font-size: 16px;
        line-height: 1.6;
    }

    .rv-form {
        background: transparent;
    }

    .rv-form-group {
        margin-bottom: 28px;
    }

    .rv-form-label {
        display: block;
        color: #888;
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    .rv-input {
        width: 100%;
        background: transparent;
        border: 1px solid #333;
        border-radius: 0;
        padding: 18px 20px;
        color: #fff;
        font-size: 15px;
        font-family: inherit;
        transition: border-color 0.3s ease;
        box-sizing: border-box;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
    }

    .rv-input:focus {
        outline: none;
        border-color: #c9a961;
    }

    .rv-input::placeholder {
        color: #555;
    }

    select.rv-input {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9a961' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 18px center;
        background-size: 18px;
        padding-right: 48px;
        cursor: pointer;
    }

    select.rv-input option {
        background: #0a0a0a;
        color: #fff;
    }

    textarea.rv-input {
        resize: vertical;
        min-height: 120px;
    }

    .btn-gold {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #c9a961;
        color: #0a0a0a;
        border: none;
        padding: 18px 32px;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        text-decoration: none;
        width: 100%;
        margin-top: 16px;
    }

    .btn-gold:hover {
        background: #d4b772;
        transform: translateY(-2px);
    }

    .btn-dark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: transparent;
        color: #c9a961;
        border: 1px solid #c9a961;
        padding: 14px 28px;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        text-decoration: none;
    }

    .btn-dark:hover {
        background: #c9a961;
        color: #0a0a0a;
    }

    @media (max-width: 768px) {
        .rv-page {
            padding: 0px 20px 60px;
        }
        .rv-form-container {
            padding: 0px 20px;
        }
        .rv-title {
            font-size: 36px;
        }
    }
</style>

<div class="rv-page">
    <div class="rv-back-wrapper">
        <a href="{% url 'inicio' %}" class="btn-dark">
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </a>
    </div>

    <div class="rv-form-container">
        <div class="rv-header">
            <span class="rv-eyebrow">Experiencia gastronómica</span>
            <h1 class="rv-title">Crear Reserva</h1>
            <p class="rv-subtitle">Completa los detalles de tu reserva y asegura tu lugar en ReserVa.</p>
        </div>

        <form method="POST" action="{% url 'crear_reserva' %}" class="rv-form">
            {% csrf_token %}

            <div class="rv-form-group">
                <label for="cantidad_personas" class="rv-form-label">Personas</label>
                <input type="number" name="cantidad_personas" id="cantidad_personas" min="1" max="20" placeholder="Ej: 4" required class="rv-input">
            </div>

            <div class="rv-form-group">
                <label for="fecha" class="rv-form-label">Fecha</label>
                <input type="date" name="fecha" id="fecha" required class="rv-input">
            </div>

            <div class="rv-form-group">
                <label for="hora" class="rv-form-label">Hora</label>
                <input type="time" name="hora" id="hora" required class="rv-input">
            </div>

            <div class="rv-form-group">
                <label for="notas" class="rv-form-label">Notas</label>
                <textarea name="notas" id="notas" rows="4" placeholder="Ej: Alergias, mesa cerca a la ventana..." class="rv-input"></textarea>
            </div>

            <div class="rv-form-group">
                <label for="preordenar" class="rv-form-label">¿Desea preordenar sus platos de una vez?</label>
                <select name="preordenar" id="preordenar" class="rv-input">
                    <option value="NO">No, solo reservar la mesa</option>
                    <option value="SI">Sí, elegir los platos ahora</option>
                </select>
            </div>

            <button type="submit" class="btn-gold">
                <i class="bi bi-calendar-check"></i> Confirmar Reserva
            </button>
        </form>
    </div>
</div>
{% endblock %}
