{% extends 'base.html' %}
{% load static %}

{% block title %}Inicia Sesión - ReserVa{% endblock %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 20px 20px 0;">
    <a href="{% url 'inicio' %}" class="btn-dark" style="display: inline-block; padding: 8px 16px; text-decoration: none; font-size: 14px;">← Volver al inicio</a>
</div>

<div style="display: flex; justify-content: center; align-items: center; padding: 30px 20px 60px;">
    <div class="reserva-card" style="width: 100%; max-width: 420px;">
        <h2 style="text-align: center; color: #fff; margin-bottom: 8px; font-size: 26px;">Bienvenido de nuevo</h2>
        <p style="text-align: center; color: #a0a5b1; font-size: 14px; margin-bottom: 25px;">Por favor, introduce tu usuario y contraseña:</p>

        <form action="" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" placeholder="Tu nombre de usuario" required name="usuario" id="usuario"/>
            </div>

            <div class="form-group">
                <label for="contraseña">Contraseña:</label>
                <input type="password" placeholder="    ••••••••" required name="contraseña" id="contraseña"/>
            
            </div>

            <button type="submit" class="btn-gold-block" style="margin-top: 20px; font-size: 16px;">Iniciar Sesión</button>

            <div style="text-align: center; margin-top: 25px; border-top: 1px solid #2a2f38; padding-top: 20px;">
                <p style="color: #a0a5b1; font-size: 14px; margin-bottom: 5px;">¿No tienes cuenta?</p>
                <a href="{% url 'crear_usuario' %}" class="gold-text" style="text-decoration: none; font-weight: bold; font-size: 14px;">Crea una cuenta aquí</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
