{% extends 'base.html' %}
{% load static %}

{% block title %}Nueva Contraseña - ReserVa{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/formularios.css' %}">
{% endblock %}

{% block content %}
<div class="rv-page">
    <div class="rv-back-wrapper">
        <a href="{% url 'iniciar_sesion' %}" class="btn-dark">
            <i class="bi bi-arrow-left"></i> Cancelar
        </a>
    </div>

    <div class="rv-login-container">
        <div class="rv-login-header">
            <span class="rv-eyebrow">Seguridad ReserVa</span>
            <h1 class="rv-login-title">Nueva Contraseña</h1>
            <p class="rv-login-subtitle">Ingresa una contraseña segura de al menos <em>8 caracteres</em>.</p>
        </div>

        <form method="POST" class="rv-form">
            {% csrf_token %}
            <div class="rv-form-group">
                <label for="password" class="rv-form-label">Nueva contraseña</label>
                <input type="password" name="password" id="password" class="rv-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-gold">
                <i class="bi bi-shield-lock"></i> Guardar contraseña
            </button>
        </form>
    </div>
</div>
{% endblock %}
