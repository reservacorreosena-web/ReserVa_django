{% extends 'base.html' %}
{% load static %}

{% block title %}Registro - ReserVa{% endblock %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 20px 20px 0;">
    <a href="{% url 'inicio' %}" class="btn-dark" style="display: inline-block; padding: 8px 16px; text-decoration: none; font-size: 14px;">← Volver al inicio</a>
</div>

<div style="display: flex; justify-content: center; align-items: center; padding: 30px 20px 60px;">
    <div class="reserva-card" style="width: 100%; max-width: 480px;">
        <h2 style="text-align: center; color: #fff; margin-bottom: 8px; font-size: 26px;">Crear una Cuenta</h2>
        <p style="text-align: center; color: #a0a5b1; font-size: 14px; margin-bottom: 25px;">Únete a <span class="gold-text">ReserVa</span> y gestiona tus reservas</p>

        <form action="" method="POST">
            {% csrf_token %}

            <!-- Nombre Completo en un solo campo (Más rápido para el usuario) -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" placeholder="Ej. Bryan Penagos" required name="nombre" id="nombre" minlength="3"/>
            </div>

            <!-- Correo Electrónico (Servirá también para iniciar sesión) -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="email">Correo Electrónico:</label>
                <input type="email" placeholder="correo@ejemplo.com" required name="email" id="email"/>
            </div>

            <!-- Contraseña -->
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="contraseña">Contraseña:</label>
                <input type="password" placeholder="••••••••" required name="contraseña" id="contraseña" minlength="8"/>
            </div>

            <button type="submit" class="btn-gold-block" style="margin-top: 20px; font-size: 16px;">Registrarme</button>

            <div style="text-align: center; margin-top: 25px; border-top: 1px solid #2a2f38; padding-top: 20px;">
                <p style="color: #a0a5b1; font-size: 14px; margin-bottom: 5px;">¿Ya tienes una cuenta?</p>
                <a href="{% url 'iniciar_sesion' %}" class="gold-text" style="text-decoration: none; font-weight: bold; font-size: 14px;">Inicia sesión aquí</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
