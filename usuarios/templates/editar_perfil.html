{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Perfil - ReserVa{% endblock %}

{% block content %}
<style>
    .rv-page {
        min-height: 100vh;
        background: #0a0a0a;
        padding: 0px 40px 80px;
        color: #f5f2eb;
    }

    .rv-back-wrapper {
        max-width: 800px;
        margin: 0 auto 30px;
    }

    .rv-form-container {
        max-width: 800px;
        margin: 0 auto;
        background: linear-gradient(135deg, #141414 0%, #0d0d0d 100%);
        border: 1px solid rgba(201, 169, 97, 0.2);
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .rv-profile-title {
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        color: #fff;
        margin-bottom: 25px;
        font-weight: 400;
    }

    .form-label {
        color: #c9a961;
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .form-control {
        background-color: #0a0a0a !important;
        border: 1px solid #333 !important;
        color: #fff !important;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 20px;
    }

    .form-control:focus {
        border-color: #c9a961 !important;
        box-shadow: 0 0 0 0.2rem rgba(201, 169, 97, 0.15) !important;
    }

    .btn-dark-custom {
        background: transparent;
        color: #c9a961;
        border: 1px solid #c9a961;
        padding: 12px 28px;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        border-radius: 0;
        text-decoration: none;
        display: inline-block;
    }

    .btn-dark-custom:hover {
        background: #c9a961;
        color: #0a0a0a;
    }
</style>

<div class="rv-page">
    <div class="rv-back-wrapper">
        <a href="javascript:history.back()" class="btn-dark-custom">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="rv-form-container">
        <h1 class="rv-profile-title">Editar Información de la Cuenta</h1>

        <!-- Mensajes de alerta (Django messages) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} mb-4" role="alert" style="background-color: #1a1a1a; border-color: #c9a961; color: #fff;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Nueva Contraseña <span class="text-muted small">(Déjalo en blanco si no deseas cambiarla)</span></label>
                <input type="password" name="contraseña" class="form-control" placeholder="Mínimo 8 caracteres">
            </div>

            <button type="submit" class="btn-dark-custom w-100 py-3">Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
